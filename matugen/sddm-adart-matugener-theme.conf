# Generated by Matugen for sddm-adart-matugener.
# Based on the config keys used by Keyitdev/sddm-astronaut-theme.
#
# Background note:
# Astronaut expects Background to be a relative path inside the theme directory.
# Therefore this points to a symlink:
#
#   /usr/share/sddm/themes/sddm-adart-matugener/Backgrounds/adart-current.png
#     -> /usr/local/share/sddm-adart-matugener/background.png
#
# Your wallpaper script/sddm-adart-apply updates the real target file.

[General]

# Screen
ScreenWidth="1920"
ScreenHeight="1080"
ScreenPadding=""

# Font
Font="Open Sans"
FontSize="13"

# Keyboard
KeyboardSize="0.4"

# Shape
RoundCorners="20"

# Locale / time
Locale=""
HourFormat="HH:mm"
DateFormat="dddd d MMMM"

# Header
HeaderText=""

# Background
BackgroundPlaceholder=""
Background="Backgrounds/adart-current.png"
BackgroundSpeed=""
PauseBackground=""
DimBackground="0.0"
CropBackground="true"
BackgroundHorizontalAlignment="center"
BackgroundVerticalAlignment="center"

# Colors generated by Matugen
# Adam-ish mapping: dark/calm surfaces, primary as accent, footer muted.
HeaderTextColor="{{colors.on_surface.default.hex}}"
DateTextColor="{{colors.on_surface.default.hex}}"
TimeTextColor="{{colors.on_surface.default.hex}}"

FormBackgroundColor="{{colors.surface_container.default.hex}}"
BackgroundColor="{{colors.background.default.hex}}"
DimBackgroundColor="{{colors.background.default.hex}}"

LoginFieldBackgroundColor="{{colors.surface_container.default.hex}}"
PasswordFieldBackgroundColor="{{colors.surface_container.default.hex}}"

LoginFieldTextColor="{{colors.on_surface.default.hex}}"
PasswordFieldTextColor="{{colors.on_surface.default.hex}}"

UserIconColor="{{colors.primary.default.hex}}"
PasswordIconColor="{{colors.primary.default.hex}}"

PlaceholderTextColor="{{colors.on_surface_variant.default.hex}}"
WarningColor="{{colors.error.default.hex}}"

LoginButtonTextColor="{{colors.on_primary.default.hex}}"
LoginButtonBackgroundColor="{{colors.primary.default.hex}}"

SystemButtonsIconsColor="{{colors.on_surface_variant.default.hex}}"
SessionButtonTextColor="{{colors.on_surface_variant.default.hex}}"
VirtualKeyboardButtonTextColor="{{colors.on_surface_variant.default.hex}}"

DropdownTextColor="{{colors.on_surface.default.hex}}"
DropdownSelectedBackgroundColor="{{colors.surface_container_highest.default.hex}}"
DropdownBackgroundColor="{{colors.surface_container.default.hex}}"

HighlightTextColor="{{colors.on_surface.default.hex}}"
HighlightBackgroundColor="{{colors.surface_container_highest.default.hex}}"
HighlightBorderColor="{{colors.primary.default.hex}}"

HoverUserIconColor="{{colors.secondary.default.hex}}"
HoverPasswordIconColor="{{colors.secondary.default.hex}}"
HoverSystemButtonsIconsColor="{{colors.primary.default.hex}}"
HoverSessionButtonTextColor="{{colors.primary.default.hex}}"
HoverVirtualKeyboardButtonTextColor="{{colors.primary.default.hex}}"

# Blur / layout
PartialBlur="true"
FullBlur=""
BlurMax=""
Blur=""

# Important for the original Astronaut look:
# false means no separate dark box behind the form.
HaveFormBackground="false"

FormPosition="center"
VirtualKeyboardPosition="center"

# Visibility
HideVirtualKeyboard="false"
HideSystemButtons="false"
HideLoginButton="false"

# Login behavior
ForceLastUser="true"
PasswordFocus="true"
HideCompletePassword="true"
AllowEmptyPassword="false"
AllowUppercaseLettersInUsernames="false"
BypassSystemButtonsChecks="false"
RightToLeftLayout="false"

# Translations
TranslatePlaceholderUsername=""
TranslatePlaceholderPassword=""
TranslateLogin=""
TranslateLoginFailedWarning=""
TranslateCapslockWarning=""
TranslateSuspend=""
TranslateHibernate=""
TranslateReboot=""
TranslateShutdown=""
TranslateSessionSelection=""
TranslateVirtualKeyboardButtonOn=""
TranslateVirtualKeyboardButtonOff=""
